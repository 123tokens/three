        .container { max-width: 900px; margin: 0 auto; padding: 0 20px; }

        .method-card {
            background: rgba(26,30,65,0.3);
            border: 1px solid #1E2350;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            transition: 0.3s;
            text-decoration: none;
            color: #E0E6FF;
        }
        .method-card:hover { border-color: #FF4D6D; transform: translateY(-4px); }
        .method-card .icon { font-size: 32px; display: block; margin-bottom: 8px; }
        .method-card .name { font-weight: 600; }
        .method-card .desc { font-size: 13px; color: #5A649A; }

        .back-link {
            display: inline-block; margin-top: 20px; color: #FF4D6D;
            text-decoration: none; font-weight: 500;
        }
        .back-link:hover { text-decoration: underline; }

        @media (max-width: 700px) {
            .method-grid { grid-template-columns: 1fr 1fr; }
            .glass-card { padding: 24px; }
        }
        @media (max-width: 450px) {

</head>
